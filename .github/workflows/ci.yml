name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No ruby-version input: setup-ruby reads .ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Ruby version from dev.yml
        id: ruby-version
        run: echo "version=$(ruby -ryaml -e 'puts YAML.load_file("dev.yml")["ruby"]')" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby-version.outputs.version }}
          bundler-cache: true

      - name: Install shadowenv
        run: |
          curl -fsSL https://github.com/Shopify/shadowenv/releases/latest/download/shadowenv-x86_64-unknown-linux-gnu -o /usr/local/bin/shadowenv
          chmod +x /usr/local/bin/shadowenv
          shadowenv --version

      - name: Verify RBIs and typecheck
        run: ./bin/tc.rb

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Ruby version from dev.yml
        id: ruby-version
        run: echo "version=$(ruby -ryaml -e 'puts YAML.load_file("dev.yml")["ruby"]')" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby-version.outputs.version }}
          bundler-cache: true

      - name: Install shadowenv
        run: |
          curl -fsSL https://github.com/Shopify/shadowenv/releases/latest/download/shadowenv-x86_64-unknown-linux-gnu -o /usr/local/bin/shadowenv
          chmod +x /usr/local/bin/shadowenv
          shadowenv --version

      - name: Run tests
        run: bundle exec rake test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: false

  # The `up/` action exercised cold: a stock image carries no dev (and may
  # carry no Homebrew), so the job runs the full install path — the one a
  # warm host skips — against this checkout, then asserts what the action
  # promises a calling job: a working `dev`, the Linux data root
  # provisioned, and the checkout's lock installed (`dev deps check` exits
  # non-zero when the installed stamp lags the lock). GH_TOKEN is the
  # credential the action's toolchain check requires; the job's own
  # token reaches every pin this public tap serves.
  up-action:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./up

      - name: Assert the host is provisioned
        run: |
          dev --version
          test -d /var/lib/dev
          dev deps check
