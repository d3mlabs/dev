# CI runs what a developer runs: `dev up`, then the check verbs dev.yml
# defines — `dev style`, `dev typecheck`, `dev test`. Nothing here invokes
# the toolchain directly: dev provisions the locked Ruby and gems from
# dependencies.rb, and every dev command errors in CI when the manifest and
# the lock disagree, so a dependencies.rb edit without `dev deps update`
# fails the first step (ai-flow#176 shipped such a lock to every host
# because its CI went through bundler and never ran dev).
#
# The jobs run this checkout's `up/` action, so a change to it is
# exercised by every job; the action installs the tap's released dev,
# whose `dev up` installs the checkout's lock. From then on, inside dev's
# own checkout, dev is the checkout: the released dev's launcher hands
# every verb to this checkout's bin/dev under the checkout's shadowenv
# (docs/cli.md), so `dev style`, `dev typecheck` and `dev test` run this
# checkout's code on its own dev.yml — a dev.yml key this checkout is the
# first to define never has to pass the released dev's reader. One job
# per verb, named as the branch protection's required checks. GH_TOKEN
# is the credential the action's toolchain check requires; the job's own
# token reaches every pin this public tap serves.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./up
      - run: dev style

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./up
      - run: dev typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./up
      - run: dev test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: false

  # The `up/` action exercised cold: a stock image carries no dev (and may
  # carry no Homebrew), so the job runs the full install path — the one a
  # warm host skips — against this checkout, then asserts what the action
  # promises a calling job: a working `dev`, the Linux data root
  # provisioned, and the checkout's lock installed (`dev deps check` exits
  # non-zero when the installed stamp lags the lock). GH_TOKEN is the
  # credential the action's toolchain check requires; the job's own
  # token reaches every pin this public tap serves.
  up-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./up

      - name: Assert the host is provisioned
        run: |
          dev --version
          test -d /var/lib/dev
          dev deps check
