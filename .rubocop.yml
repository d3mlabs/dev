# The org tier: rubocop-shopify + rubocop-sorbet, every file carries a
# `typed:` sigil, no endless defs, RSpock test-dialect exclusions.
inherit_gem:
  rubocop-d3mlabs: rubocop.yml

inherit_mode:
  merge:
    - Exclude

# dev's own cop: the one layering rule (ADR-0014). Not shipped — the
# gate's, not the tool's.
require:
  - ./rubocop/cop/dev/shell_reference

AllCops:
  Exclude:
    # Polyglot sh/ruby bootstrap scripts (#!/bin/sh preamble re-execing via
    # `ruby -x`); not parseable as plain Ruby.
    - bin/**/*
    - tmp/**/*
    # Deployment payloads: a Brewfile is Homebrew's DSL, read by `brew
    # bundle`, not Ruby of dev's own.
    - deploy/**/Brewfile

# Production code is `typed: strict`. Test files are exempt (RSpock's AST
# transform and type pinnings in setup methods keep them at `typed: false`);
# sigil presence is still enforced there by the org tier's Sorbet/ValidSigil.
Sorbet/StrictSigil:
  Enabled: true
  Include:
    - lib/**/*
  Exclude:
    # `typed: false` holdouts. Data.define with a keyword-args initialize
    # override is rejected by Sorbet (error 4010)...
    - lib/dev/deps/dependency.rb
    # ...and Fetcher consumes a consumer-repo Lockfile API (parse,
    # runtime_ref_map) that doesn't resolve against this repo's Lockfile.
    - lib/dev/deps/fetcher.rb
    # Integration manifests are DSL files evaluated with Kernel.load, like
    # the root dependencies.rb: their verbs are DSL methods Sorbet does not
    # see statically.
    - lib/dev/deps/*_integration/dependencies.rb

# Nothing under lib/dev outside the shell (lib/dev/cli/) references a
# `Dev::Cli::*` constant — features and the vocabulary never depend on the
# shell (ADR-0014, dev#537).
Dev/ShellReference:
  Enabled: true
