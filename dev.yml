name: dev
# dev's own two targets (dev#192 K3, dev#429): what the d3mlabs tap ships as two
# formulas. Neither compiles — the checkout is the stage, and each target's
# `files:` selects what its formula installs; dev's archive packager zips the
# selection into the release asset the formula points at.
targets:
  dev-core:
    desc: The org-blank tool (bin, lib, share, VERSION)
    # The manifest and locks stay out: the formula owns dev-core's runtime,
    # so the tree is framework-dependent by design. The org payload is the
    # sibling `dev` target's; nothing of it is here. Anchored (gitignore
    # syntax): a bare `lib` would also take test/lib.
    packager:
      archive:
        files:
          - /bin
          - /lib
          - /share
          - /VERSION
          - /LICENSE
          - /README.md
  dev:
    desc: The d3mlabs deployment of dev (config.yml + Brewfile)
    # Paths as in the checkout; Formula/dev.rb installs them by name. README
    # and LICENSE ride along as the keg's payload: the two etc files land
    # outside the keg, and brew refuses an empty one (dev#517).
    packager:
      archive:
        files:
          - /deploy/d3mlabs/config.yml
          - /deploy/d3mlabs/Brewfile
          - /LICENSE
          - /README.md
commands:
  up:
    desc: Setup dev environment (install bundler from dependencies.rb, bundle install)
    run: ./bin/setup.rb
  rbi:
    desc: Regenerate gem RBI files (run after changing Gemfile)
    run: ./bin/rbi.rb
  typecheck:
    desc: Type check (verify gem RBIs are in sync, then srb tc)
    run: ./bin/typecheck.rb
  test:
    desc: Run this repo's tests
    run: ./bin/test.rb
  style:
    desc: Run RuboCop
    run: bundle exec rubocop
  deploy:
    commands:
      # The lock's brew publisher (dependencies.rb pins ruby from the d3mlabs tap):
      # one formula per target, named as the target — Formula/dev-core.rb and
      # Formula/dev.rb — each pointed at its own release asset. Releases only:
      # `dev deploy brew --release <version>`.
      brew:
        desc: Point the d3mlabs tap's dev-core and dev formulas at a release
        targets: [dev-core, dev]
  # Every build of both targets: `dev release <version>` bumps VERSION, tags,
  # pushes, and attaches dev-core-<version>.zip and dev-<version>.zip.
  release:
    desc: Cut a release (bump, tag, push, both archives on the GitHub release)
  console:
    desc: Start Ruby console
    run: ./bin/console
    repl: true
